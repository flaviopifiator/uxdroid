[package]
name = "uxdroid-nativebridge"
description = "Lets ART load bionic-linked libraries through the uxdroid bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# rlib too, so the tests call `NativeBridgeItf` as ART does.
crate-type = ["cdylib", "rlib"]

[dependencies]
uxdroid-bridge = { path = "../bridge" }
uxdroid-ndk = { path = "../ndk" }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux", target_env = "gnu"))'.dependencies]
# The arm64 engine exists only for x86_64 hosts; another host's package runs its own ABI natively.
uxdroid-translate = { path = "../translate" }
