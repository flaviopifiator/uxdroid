[package]
name = "uxdroid-cli"
description = "Command line interface for uxdroid"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "uxdroid"
path = "src/main.rs"

[dependencies]
uxdroid-apk = { path = "../apk" }
uxdroid-bridge = { path = "../bridge" }
libc = "0.2"
serde_json = "1"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
uxdroid-system = { path = "../system" }
uxdroid-store = { path = "../store" }
sha2 = { version = "0.10", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
# Already in the build through crossterm; catches the signals that end the terminal UI.
signal-hook = "0.3.18"

[target.'cfg(all(target_arch = "x86_64", target_os = "linux", target_env = "gnu"))'.dependencies]
# The arm64 engine exists only for x86_64 hosts; another host's package runs its own ABI natively.
uxdroid-translate = { path = "../translate" }
uxdroid-ndk = { path = "../ndk" }

[dev-dependencies]
uxdroid-testkit = { path = "../testkit" }
