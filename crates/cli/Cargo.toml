[package]
name = "uxdroid-cli"
description = "Command line interface for uxdroid"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "uxdroid"
path = "src/main.rs"

[dependencies]
uxdroid-apk = { path = "../apk" }
uxdroid-bridge = { path = "../bridge" }
libc = "0.2"

[dev-dependencies]
uxdroid-testkit = { path = "../testkit" }
