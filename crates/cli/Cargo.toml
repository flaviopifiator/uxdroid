[package]
name = "uxdroid-cli"
description = "Command line interface for uxdroid"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "uxdroid"
path = "src/main.rs"

[dependencies]
uxdroid-apk = { path = "../apk" }
uxdroid-bridge = { path = "../bridge" }
uxdroid-translate = { path = "../translate" }
libc = "0.2"
serde_json = "1"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
uxdroid-system = { path = "../system" }

[dev-dependencies]
uxdroid-testkit = { path = "../testkit" }
