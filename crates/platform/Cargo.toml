[package]
name = "uxdroid-platform"
description = "Native half of uxdroid's android.* classes: windows and drawing on Wayland"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
font8x8 = "0.3.1"
jni-sys = "0.4"
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
