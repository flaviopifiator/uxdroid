[package]
name = "uxdroid-apk"
description = "Reads APK files and plans how to execute them"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit"] }
sha1 = { version = "0.10", default-features = false, features = ["oid"] }
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
uxdroid-testkit = { path = "../testkit" }
