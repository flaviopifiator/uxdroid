services:
  # Builds and tests. Has network access to fetch crates.
  dev:
    image: uxdroid-dev
    build: .
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - .:/work
      - cache:/cache

  # Handles untrusted APKs: no network, source and samples read-only.
  sandbox:
    extends: dev
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - .:/work:ro
      - cache:/cache:ro
      - ${UXDROID_SAMPLES:-./samples}:/samples:ro

  # Compares loader performance against competitors. Offline, with real libraries read-only.
  bench:
    profiles: [bench]
    build:
      context: .
      dockerfile: benches/loader/Dockerfile
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    tmpfs: ["/tmp:exec"]
    volumes:
      - .:/work:ro
      - cache:/cache:ro
      - ${UXDROID_SAMPLES:-./samples}:/samples:ro

volumes:
  cache:
