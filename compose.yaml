services:
  # Builds and tests. Has network access to fetch crates.
  dev:
    image: uxdroid-dev
    build: .
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - .:/work
      - cache:/cache

  # Handles untrusted APKs: no network, source and samples read-only.
  sandbox:
    extends: dev
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - .:/work:ro
      - cache:/cache:ro
      - ${UXDROID_SAMPLES:-./samples}:/samples:ro

  # Compares loader performance against competitors. Offline, with real libraries read-only.
  bench:
    profiles: [bench]
    build:
      context: .
      dockerfile: benches/loader/Dockerfile
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    tmpfs: ["/tmp:exec"]
    volumes:
      - .:/work:ro
      - cache:/cache:ro
      - ${UXDROID_SAMPLES:-./samples}:/samples:ro

  # Downloads and builds ART. Network access only for the download; output stays in a volume.
  art-builder:
    profiles: [art]
    build: runtime/art
    user: "1000:1000"
    # Running out of memory must kill the build, never freeze the machine (30 GiB RAM).
    mem_limit: 22g
    memswap_limit: 22g
    cpus: 10
    security_opt: ["no-new-privileges:true"]
    volumes:
      - art_src:/aosp
      - art_runtime:/runtime
      - .:/work:ro

  # Runs packaged ART in a plain Ubuntu with no AOSP tree, no network and a read-only system.
  art-runtime:
    profiles: [art]
    image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:exec"]
    volumes:
      - art_runtime:/runtime:ro
      - .:/work:ro

  # Compares ART startup and compiled code speed against art_standalone. Offline.
  art-bench:
    profiles: [art]
    build:
      context: .
      dockerfile: benches/art/Dockerfile
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    tmpfs: ["/tmp:exec"]
    volumes:
      - art_runtime:/runtime:ro
      - art_competitor:/competitor
      - .:/work:ro

volumes:
  cache:
  art_src:
  art_runtime:
  art_competitor:
