# Lint and test, then a .deb and a .tar.gz per CPU, then each package installed and used on every
# distribution of the matrix. A v* tag also publishes the packages as a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: uxdroid-dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
      # The dev image runs as uid 1000 and the checkout belongs to the runner's user.
      - name: Let the dev user read the checkout
        run: chmod -R a+rX .
      - name: Format and lint
        run: >
          docker compose run --rm -T dev sh -c
          'cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings'
      - name: Test
        run: docker compose run --rm -T dev cargo test --workspace

  package:
    name: Package ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the packager image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/Dockerfile
          tags: uxdroid-packager
          load: true
          cache-from: type=gha,scope=packager
          cache-to: type=gha,scope=packager,mode=max
      - name: Build the packages
        env:
          # A tag names the release's version; any other build is the workspace's, marked by run.
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          VERSION_SUFFIX: ${{ !startsWith(github.ref, 'refs/tags/v') && format('+ci.{0}', github.run_number) || '' }}
        run: >
          docker compose run --rm -T --user "$(id -u):$(id -g)" -e VERSION -e VERSION_SUFFIX
          packager packaging/build.sh ${{ matrix.arch }} /work/dist
      - name: Summarize the packages
        run: |
          {
            echo '<img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/logo/icon.svg" alt="" width="48">'
            echo
            echo '### uxdroid packages for ${{ matrix.arch }}'
            echo
            echo '```'
            (cd dist && ls -l --block-size=K -- *.deb *.tar.gz | awk '{print $5, $9}')
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  install:
    name: Install on ${{ matrix.distro }} ${{ matrix.arch }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist
      # arm64 runs under QEMU user on the x86_64 runner.
      - if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Install and use the package
        run: >
          docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD:/work:ro"
          ${{ matrix.distro }} bash /work/packaging/smoke.sh /work/dist

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/SHA256SUMS-* > dist/SHA256SUMS && rm dist/SHA256SUMS-*
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "uxdroid $GITHUB_REF_NAME" --generate-notes \
            --notes "<img src=\"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/docs/logo/icon.svg\" alt=\"\" width=\"64\">"
